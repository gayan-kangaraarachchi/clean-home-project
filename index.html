<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home Rhythm</title>
  <meta name="description" content="Daily habits and household chore planner.">

  <!-- App / home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#EEF2F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F161B" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Home Rhythm">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">

  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <div class="langbar">
      <label for="langSelect" class="lang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span class="visually-hidden" data-i18n="app.language">Language</span>
        <select id="langSelect"></select>
      </label>
    </div>

    <header class="top">
      <div class="hd-text">
        <div class="eyebrow" id="dateLine">Today</div>
        <h1 id="headline">Your home, on rhythm</h1>
        <p class="sub" id="subline" data-i18n="header.loading">Loading your chores…</p>
      </div>
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="var(--line)" stroke-width="4"/>
          <circle id="ringArc" cx="20" cy="20" r="16" fill="none" stroke="var(--ok)" stroke-width="4"
                  stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="100.5"
                  style="transition:stroke-dashoffset .4s"/>
        </svg>
        <div class="num" id="ringNum">0/0</div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-today" aria-selected="true" data-view="today" data-i18n="tabs.today">Today</button>
      <button role="tab" id="tab-week" aria-selected="false" data-view="week" data-i18n="tabs.week">Week</button>
      <button role="tab" id="tab-habits" aria-selected="false" data-view="habits" data-i18n="tabs.habits">Habits</button>
    </nav>

    <main id="view"></main>
    <p class="foot" id="storeNote" data-i18n="storage.saved">Saved on this device.</p>
  </div>

  <div id="sheetHost"></div>
</body>
</html>
